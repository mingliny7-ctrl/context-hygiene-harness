<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Conversation Collector</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <div class="title">Conversation Collector</div>
            <div class="subtitle">ChatGPT 历史采集</div>
        </div>
        <div id="statusBadge" class="status">--</div>
    </div>
    <div class="section">
        <div class="section-title">当前对话</div>
        <div id="conversationTitle">正在获取对话名称</div>
    </div>
    <div class="stats">
        <div class="stat">
            <div class="stat-label">已保存模型回复</div>
            <div id="messageCount" class="stat-value">-</div>
        </div>
    </div>
    <div class="section">
        <div class="section-title">最近保存的模型回答</div>
        <div id="latestAnswer">正在确认已保存回答…</div>
    </div>
    <div class="section">
        <div class="section-title">采集状态</div>
        <div id="reasons">正在读取当前聊天...</div>
    </div>
    <div id="connectionNotice" class="connection-notice"></div>
    <div class="service-actions">
        <button id="startCollector" type="button">启动采集</button>
        <button id="openAtlas" type="button">打开图谱</button>
    </div>
    <div id="serviceActionNotice" role="status" aria-live="polite"></div>
</div>
<script src="popup.js"></script>
<script src="popup_service_controls.js"></script>
</body>
</html>
